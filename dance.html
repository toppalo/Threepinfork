<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dance - ThreePinFork</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Minimal Navigation -->
  <nav class="minimal-nav">
    <div class="nav-wrapper">
      <a href="index.html" class="logo">ThreePinFork</a>
      <ul class="nav-menu">
        <li><a href="index.html">OVERVIEW</a></li>
        <li><a href="portraits.html">PORTRAITS</a></li>
        <li><a href="dance.html" class="active">DANCE</a></li>
        <li><a href="engagement.html">ENGAGEMENT</a></li>
        <li><a href="fashion.html">FASHION</a></li>
        <li><a href="about.html">ABOUT</a></li>
        <li><a href="contact.html">CONTACT</a></li>
      </ul>
      <div class="menu-toggle">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </nav>

  <!-- Category Header -->
  <div class="category-header">
    <h1>DANCE</h1>
  </div>

  <!-- Dance Categories Grid -->
  <main class="gallery-main">
    <div class="dance-categories-grid">
      <!-- Chavalos Category -->
      <div class="category-card" data-category="chavalos">
        <img src="images/dance/Chavalos/chavalos_main.jpg" alt="Chavalos">
        <div class="category-overlay">
          <span class="category-name">Chavalos</span>
        </div>
      </div>
    </div>
  </main>

  <!-- Hidden image data for each category -->
  <div id="category-images" style="display: none;">
    <div data-category="chavalos">
      <img data-src="images/dance/Chavalos/chavalos_main.jpg">
      <img data-src="images/dance/Chavalos/random (1 of 15).jpg">
      <img data-src="images/dance/Chavalos/random (10 of 15).jpg">
      <img data-src="images/dance/Chavalos/random (11 of 15).jpg">
      <img data-src="images/dance/Chavalos/random (12 of 15).jpg">
      <img data-src="images/dance/Chavalos/random (13 of 15).jpg">
      <img data-src="images/dance/Chavalos/random (14 of 15).jpg">
      <img data-src="images/dance/Chavalos/random (15 of 15).jpg">
      <img data-src="images/dance/Chavalos/random (2 of 15).jpg">
      <img data-src="images/dance/Chavalos/random (3 of 15).jpg">
      <img data-src="images/dance/Chavalos/random (4 of 15).jpg">
      <img data-src="images/dance/Chavalos/random (5 of 15).jpg">
      <img data-src="images/dance/Chavalos/random (6 of 15).jpg">
      <img data-src="images/dance/Chavalos/random (7 of 15).jpg">
      <img data-src="images/dance/Chavalos/random (8 of 15).jpg">
      <img data-src="images/dance/Chavalos/random (9 of 15).jpg">
    </div>
  </div>

  <!-- Modal for full-size images -->
  <div class="modal" id="imageModal">
    <span class="modal-close">&times;</span>
    <img class="modal-content" id="modalImage" src="" alt="">
    <div class="modal-nav">
      <button class="modal-prev">‹</button>
      <button class="modal-next">›</button>
    </div>
    <!-- Thumbnail strip -->
    <div class="modal-thumbnails" id="modalThumbnails"></div>
  </div>

  <script src="script.js"></script>
  <script src="dance-slideshow.js"></script>
</body>
</html>
