<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portraits - ThreePinFork</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Minimal Navigation -->
  <nav class="minimal-nav">
    <div class="nav-wrapper">
      <a href="index.html" class="logo">ThreePinFork</a>
      <ul class="nav-menu">
        <li><a href="index.html">OVERVIEW</a></li>
        <li><a href="portraits.html" class="active">PORTRAITS</a></li>
        <li><a href="dance.html">DANCE</a></li>
        <li><a href="engagement.html">ENGAGEMENT</a></li>
        <li><a href="fashion.html">FASHION</a></li>
        <li><a href="about.html">ABOUT</a></li>
        <li><a href="contact.html">CONTACT</a></li>
      </ul>
      <div class="menu-toggle">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </nav>

  <!-- Category Header -->
  <div class="category-header">
    <h1>PORTRAITS</h1>
  </div>

  <!-- Portraits Categories Grid -->
  <main class="gallery-main">
    <div class="portraits-categories-grid">
      <!-- Anna Category -->
      <div class="category-card" data-category="anna">
        <img src="images/portraits/Anna/Anna_main.jpg" alt="Anna">
        <div class="category-overlay">
          <span class="category-name">Anna</span>
        </div>
      </div>
      <!-- Belen Category -->
      <div class="category-card" data-category="belen">
        <img src="images/portraits/Belen/Belen_main.jpg" alt="Belen">
        <div class="category-overlay">
          <span class="category-name">Belen</span>
        </div>
      </div>
      <!-- Kate Category -->
      <div class="category-card" data-category="kate">
        <img src="images/portraits/Kate/Kate_Main.jpg" alt="Kate">
        <div class="category-overlay">
          <span class="category-name">Kate</span>
        </div>
      </div>
      <!-- Mayu Category -->
      <div class="category-card" data-category="mayu">
        <img src="images/portraits/Mayu/Mayu_main.jpg" alt="Mayu">
        <div class="category-overlay">
          <span class="category-name">Mayu</span>
        </div>
      </div>
      <!-- Micol Category -->
      <div class="category-card" data-category="micol">
        <img src="images/portraits/Micol/Micol_main.jpg" alt="Micol">
        <div class="category-overlay">
          <span class="category-name">Micol</span>
        </div>
      </div>
      <!-- Sherly Category -->
      <div class="category-card" data-category="sherly">
        <img src="images/portraits/Sherly/Sherly_Main.jpg" alt="Sherly">
        <div class="category-overlay">
          <span class="category-name">Sherly</span>
        </div>
      </div>
      <!-- Taha Category -->
      <div class="category-card" data-category="taha">
        <img src="images/portraits/Taha/Taha_Main.jpg" alt="Taha">
        <div class="category-overlay">
          <span class="category-name">Taha</span>
        </div>
      </div>
    </div>
  </main>

  <!-- Hidden image data for each category -->
  <div id="category-images" style="display: none;">
    <div data-category="anna">
      <img data-src="images/portraits/Anna/Anna_main.jpg">
      <img data-src="images/portraits/Anna/Anna (3 of 5).jpg">
      <img data-src="images/portraits/Anna/Anna (4 of 5).jpg">
      <img data-src="images/portraits/Anna/Anna (5 of 5).jpg">
    </div>
    <div data-category="belen">
      <img data-src="images/portraits/Belen/Belen_main.jpg">
      <img data-src="images/portraits/Belen/kate (1 of 6).jpg">
      <img data-src="images/portraits/Belen/kate (2 of 6).jpg">
      <img data-src="images/portraits/Belen/kate (3 of 6).jpg">
      <img data-src="images/portraits/Belen/kate (5 of 6).jpg">
      <img data-src="images/portraits/Belen/kate (6 of 6).jpg">
    </div>
    <div data-category="kate">
      <img data-src="images/portraits/Kate/Kate_Main.jpg">
      <img data-src="images/portraits/Kate/kate (1 of 19).jpg">
      <img data-src="images/portraits/Kate/kate (14 of 19).jpg">
      <img data-src="images/portraits/Kate/kate (15 of 19).jpg">
      <img data-src="images/portraits/Kate/kate (7 of 19).jpg">
      <img data-src="images/portraits/Kate/kate (9 of 19).jpg">
    </div>
    <div data-category="mayu">
      <img data-src="images/portraits/Mayu/Mayu_main.jpg">
      <img data-src="images/portraits/Mayu/Mayu (11 of 17).jpg">
      <img data-src="images/portraits/Mayu/Mayu (14 of 17).jpg">
      <img data-src="images/portraits/Mayu/Mayu (9 of 17).jpg">
    </div>
    <div data-category="micol">
      <img data-src="images/portraits/Micol/Micol_main.jpg">
      <img data-src="images/portraits/Micol/micol (1 of 5).jpg">
      <img data-src="images/portraits/Micol/micol (2 of 5).jpg">
      <img data-src="images/portraits/Micol/micol (4 of 5).jpg">
      <img data-src="images/portraits/Micol/micol (5 of 5).jpg">
    </div>
    <div data-category="sherly">
      <img data-src="images/portraits/Sherly/Sherly_Main.jpg">
      <img data-src="images/portraits/Sherly/Sherly_Moto_best (1 of 2).jpg">
    </div>
    <div data-category="taha">
      <img data-src="images/portraits/Taha/Taha_Main.jpg">
    </div>
  </div>

  <!-- Modal for full-size images -->
  <div class="modal" id="imageModal">
    <span class="modal-close">&times;</span>
    <img class="modal-content" id="modalImage" src="" alt="">
    <div class="modal-nav">
      <button class="modal-prev">‹</button>
      <button class="modal-next">›</button>
    </div>
    <!-- Thumbnail strip -->
    <div class="modal-thumbnails" id="modalThumbnails"></div>
  </div>

  <script src="script.js"></script>
  <script src="portraits-slideshow.js"></script>
</body>
</html>
